<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Inkwell — Jane Yates</title>
<meta name="description" content="An oracle of ink. Ask a question and watch the answer surface.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #0B0910;
    background-image: radial-gradient(ellipse at 50% 28%, #26202F 0%, #0B0910 68%);
    color: #E8DCC0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2.5rem 1rem 4rem; gap: 1.25rem;
  }
  h1 {
    font-family: 'Cinzel', Georgia, serif; font-weight: 500;
    font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: 0.18em; margin: 0;
    color: #E3C36A; text-shadow: 0 2px 14px rgba(227,195,106,0.28);
  }
  .sub { margin: -0.5rem 0 0.5rem; font-size: 1.05rem; font-style: italic; color: #9C8F76; }

  .frame { position: relative; width: min(620px, 94vw); aspect-ratio: 1; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  #framePhoto { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; display: none; pointer-events: none; }

  #cv {
    position: absolute; left: 25.8%; top: 25.8%; width: 48.4%; height: 48.4%;
    border-radius: 50%; background: #13111A; cursor: pointer; z-index: 1;
    box-shadow: inset 0 0 46px rgba(0,0,0,0.95);
  }
  #ans {
    position: absolute; left: 28.5%; top: 28.5%; width: 43%; height: 43%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: clamp(1rem, 3vw, 1.4rem); line-height: 1.4; color: #F4E6C4;
    text-shadow: 0 0 20px rgba(0,0,0,0.95); opacity: 0.45;
    transition: opacity 0.9s ease; pointer-events: none; z-index: 4;
  }

  .controls { display: flex; flex-direction: column; align-items: center; gap: 1rem; width: min(460px, 92vw); }
  input {
    width: 100%; padding: 0.75rem 1rem; background: rgba(19,17,26,0.85);
    border: 1px solid #6B5A2E; border-radius: 3px; color: #E8DCC0;
    font-family: inherit; font-size: 1.05rem; text-align: center;
  }
  input::placeholder { color: #7A6E58; font-style: italic; }
  input:focus { outline: none; border-color: #C9A44C; box-shadow: 0 0 0 3px rgba(201,164,76,0.15); }

  .row { display: flex; gap: 0.75rem; align-items: center; }
  button {
    font-family: 'Cinzel', serif; font-size: 0.9rem; letter-spacing: 0.14em;
    padding: 0.7rem 1.6rem; color: #2A2112;
    background: linear-gradient(180deg, #F0DCA0 0%, #C9A44C 45%, #9A7A2E 100%);
    border: 1px solid #6B5A2E; border-radius: 3px; cursor: pointer;
    box-shadow: 0 2px 0 #574518, 0 4px 10px rgba(0,0,0,0.5);
  }
  button:hover { background: linear-gradient(180deg, #F7E7B8 0%, #D6B45E 45%, #A98836 100%); }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #574518, 0 2px 6px rgba(0,0,0,0.5); }
  button:focus-visible { outline: 2px solid #F0DCA0; outline-offset: 3px; }
  #mute { padding: 0.7rem 0.9rem; font-size: 1rem; letter-spacing: 0; }

  footer { margin-top: 1rem; font-size: 0.9rem; color: #6E6455; letter-spacing: 0.06em; }
  footer a { color: #9C8F76; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<h1>The Inkwell</h1>
<p class="sub">Ask, and let the ink decide</p>

<div class="frame">
  <canvas id="cv" role="button" tabindex="0" aria-label="Consult the inkwell"></canvas>
  <div id="ans">Touch the ink</div>
  <img id="framePhoto" alt="">
  <svg id="orn" viewBox="0 0 620 620" aria-hidden="true"></svg>
</div>

<div class="controls">
  <label class="sr-only" for="q">Your question</label>
  <input id="q" type="text" placeholder="Ask the ink something" autocomplete="off">
  <div class="row">
    <button id="go">Consult the ink</button>
    <button id="mute" aria-label="Mute sound" title="Sound on or off">&#9835;</button>
  </div>
</div>

<footer>Jane Yates &middot; <a href="https://github.com/oxfordcitydog/janeyates">source</a></footer>

<script>
(function(){

var NS = 'http://www.w3.org/2000/svg';
var svg = document.getElementById('orn');
var CX = 310, CY = 310, APERTURE = 148;

function mk(name, attrs, parent){
  var n = document.createElementNS(NS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}

svg.innerHTML =
  '<defs>' +
  '<linearGradient id="gold" x1="0.1" y1="0" x2="0.75" y2="1">' +
    '<stop offset="0%" stop-color="#FDF3D8"/><stop offset="18%" stop-color="#EBD08A"/>' +
    '<stop offset="45%" stop-color="#C09632"/><stop offset="72%" stop-color="#7C5E1E"/>' +
    '<stop offset="100%" stop-color="#D4AE55"/></linearGradient>' +
  '<linearGradient id="goldB" x1="0.3" y1="0" x2="0.7" y2="1">' +
    '<stop offset="0%" stop-color="#F7E3AE"/><stop offset="48%" stop-color="#B88E2C"/>' +
    '<stop offset="100%" stop-color="#5E4718"/></linearGradient>' +
  '<radialGradient id="hollow" cx="0.5" cy="0.5" r="0.5">' +
    '<stop offset="80%" stop-color="#000" stop-opacity="0"/>' +
    '<stop offset="100%" stop-color="#000" stop-opacity="0.8"/></radialGradient>' +
  '<mask id="ap"><rect width="620" height="620" fill="#fff"/>' +
    '<circle cx="310" cy="310" r="' + APERTURE + '" fill="#000"/></mask>' +
  '</defs>' +
  '<g id="body" mask="url(#ap)"></g>' +
  '<circle cx="310" cy="310" r="' + APERTURE + '" fill="url(#hollow)"/>';

var body = document.getElementById('body');

function carve(d, opts){
  opts = opts || {};
  var w = opts.stroke || 0;
  var solid = opts.fill !== false;
  mk('path', { d: d, fill: solid ? '#3A2B0C' : 'none', stroke: '#3A2B0C',
    'stroke-width': w ? w + 3 : 0, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    transform: 'translate(3.5 4)', opacity: 0.85 }, opts.parent || body);
  mk('path', { d: d, fill: solid ? 'url(#goldB)' : 'none', stroke: w ? 'url(#goldB)' : '#4A3712',
    'stroke-width': w || 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, opts.parent || body);
  mk('path', { d: d, fill: 'none', stroke: '#FDF3D8', 'stroke-width': w ? w * 0.3 : 1,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    transform: 'translate(-1.5 -2)', opacity: 0.45 }, opts.parent || body);
}

function volute(cx, cy, r0, turns, growth, rot, dir){
  var d = '', steps = Math.round(turns * 46);
  for (var i = 0; i <= steps; i++){
    var th = i / 46 * Math.PI * 2;
    var r = r0 * Math.pow(growth, th / (Math.PI * 2));
    var a = rot + th * (dir || 1);
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ',' + (cy + Math.sin(a) * r).toFixed(1);
  }
  return d;
}

var LEAF = 'M0,0 C -16,-15 -24,-40 -14,-66 C -6,-51 -2,-40 0,-32 C 2,-40 6,-51 14,-66 C 24,-40 16,-15 0,0 Z';

mk('rect', { x: 78, y: 78, width: 464, height: 464, rx: 5, fill: '#3A2B0C', opacity: 0.9 }, body);
mk('rect', { x: 74, y: 74, width: 464, height: 464, rx: 5, fill: 'url(#gold)', stroke: '#4A3712', 'stroke-width': 2 }, body);
mk('rect', { x: 92, y: 92, width: 428, height: 428, rx: 3, fill: 'none', stroke: '#5C4718', 'stroke-width': 5, opacity: 0.55 }, body);
mk('rect', { x: 100, y: 100, width: 412, height: 412, rx: 3, fill: 'none', stroke: '#FDF3D8', 'stroke-width': 1.2, opacity: 0.4 }, body);

for (var s = 0; s < 4; s++){
  var g = mk('g', { transform: 'rotate(' + (s * 90) + ' 310 310)' }, body);
  for (var b = 0; b < 22; b++){
    var bx = 118 + b * 17.5;
    mk('circle', { cx: bx, cy: 111, r: 3.6, fill: 'url(#goldB)', stroke: '#4A3712', 'stroke-width': 0.7 }, g);
    mk('circle', { cx: bx - 1, cy: 110, r: 1.3, fill: '#FDF3D8', opacity: 0.6 }, g);
  }
}

for (var c = 0; c < 4; c++){
  var cg = mk('g', { transform: 'rotate(' + (c * 90) + ' 310 310)' }, body);
  carve(volute(150, 150, 8, 2.4, 1.85, -0.6, 1), { stroke: 11, fill: false, parent: cg });
  carve(volute(196, 118, 5, 2.0, 1.9, 2.4, -1), { stroke: 8, fill: false, parent: cg });
  carve(volute(118, 196, 5, 2.0, 1.9, 0.9, 1), { stroke: 8, fill: false, parent: cg });
  carve(LEAF, { parent: mk('g', { transform: 'translate(150 150) rotate(45) scale(1.15)' }, cg) });
  carve(LEAF, { parent: mk('g', { transform: 'translate(232 96) rotate(96) scale(0.8)' }, cg) });
  carve(LEAF, { parent: mk('g', { transform: 'translate(96 232) rotate(-6) scale(0.8)' }, cg) });
  carve('M104,104 C 130,86 158,84 182,92 C 156,98 132,112 118,132 C 116,120 112,110 104,104 Z', { parent: cg });
}

for (var m = 0; m < 4; m++){
  var mg = mk('g', { transform: 'rotate(' + (m * 90) + ' 310 310)' }, body);
  carve('M310,46 C 330,60 342,80 344,102 C 330,92 320,88 310,88 C 300,88 290,92 276,102 C 278,80 290,60 310,46 Z', { parent: mg });
  carve(volute(280, 96, 4, 1.7, 1.9, 1.2, -1), { stroke: 7, fill: false, parent: mg });
  carve(volute(340, 96, 4, 1.7, 1.9, 1.9, 1), { stroke: 7, fill: false, parent: mg });
  carve(LEAF, { parent: mk('g', { transform: 'translate(310 118) scale(0.55)' }, mg) });
}

mk('circle', { cx: CX, cy: CY, r: APERTURE + 44, fill: '#3A2B0C', opacity: 0.5 }, body);
mk('circle', { cx: CX, cy: CY, r: APERTURE + 38, fill: 'none', stroke: 'url(#gold)', 'stroke-width': 26 }, body);
for (var k = 0; k < 76; k++){
  var a2 = k * Math.PI * 2 / 76;
  var kx = CX + Math.cos(a2) * (APERTURE + 20), ky = CY + Math.sin(a2) * (APERTURE + 20);
  mk('circle', { cx: kx, cy: ky, r: 4.4, fill: 'url(#goldB)', stroke: '#4A3712', 'stroke-width': 0.7 }, body);
  mk('circle', { cx: kx - 1.2, cy: ky - 1.2, r: 1.6, fill: '#FDF3D8', opacity: 0.6 }, body);
}
for (var v = 0; v < 24; v++){
  carve(LEAF, { parent: mk('g', { transform: 'rotate(' + (v * 15) + ' 310 310) translate(310 ' + (CY - APERTURE - 62) + ') scale(0.62)' }, body) });
}
mk('circle', { cx: CX, cy: CY, r: APERTURE + 7, fill: 'none', stroke: 'url(#goldB)', 'stroke-width': 13 }, body);
mk('circle', { cx: CX, cy: CY, r: APERTURE + 1, fill: 'none', stroke: '#241A06', 'stroke-width': 4 }, body);
mk('circle', { cx: CX, cy: CY, r: APERTURE + 14, fill: 'none', stroke: '#FDF3D8', 'stroke-width': 1, opacity: 0.5 }, body);

var AC = null, muted = false;
function ac(){ if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }

function waterSwell(){
  if (muted) return;
  var a = ac(), dur = 2.2, now = a.currentTime;
  var buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
  var ch = buf.getChannelData(0);
  for (var i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * 0.5;
  var src = a.createBufferSource(); src.buffer = buf;
  var lp = a.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(180, now);
  lp.frequency.exponentialRampToValueAtTime(900, now + 0.5);
  lp.frequency.exponentialRampToValueAtTime(120, now + dur);
  lp.Q.value = 3;
  var gn = a.createGain();
  gn.gain.setValueAtTime(0.0001, now);
  gn.gain.exponentialRampToValueAtTime(0.16, now + 0.18);
  gn.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(lp); lp.connect(gn); gn.connect(a.destination);
  src.start(now); src.stop(now + dur);

  var o = a.createOscillator(), og = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, now);
  o.frequency.exponentialRampToValueAtTime(46, now + 1.1);
  og.gain.setValueAtTime(0.14, now);
  og.gain.exponentialRampToValueAtTime(0.0001, now + 1.3);
  o.connect(og); og.connect(a.destination);
  o.start(now); o.stop(now + 1.35);
}

function chime(){
  if (muted) return;
  var a = ac(), now = a.currentTime, base = 392;
  [1, 2.02, 3.01].forEach(function(mult, i){
    var o = a.createOscillator(), g2 = a.createGain();
    o.type = 'sine';
    o.frequency.value = base * mult;
    g2.gain.setValueAtTime(0.0001, now);
    g2.gain.exponentialRampToValueAtTime(0.09 / (i + 1), now + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);
    o.connect(g2); g2.connect(a.destination);
    o.start(now); o.stop(now + 3.3);
  });
}

var answers = [
  'It is already written, and it is good', 'The ink says yes',
  'Sooner than you dared hope', 'Yes, and it will be quiet',
  'Certainly, and twice over', 'Someone is already on your side',
  'Trust the first thought you had', 'A door is open. Walk through it',
  'The ink laughs. Take that as a yes', 'There is a letter coming',
  'Begin, and the way will show', 'You are closer than you think',
  'The answer arrives on a Tuesday', 'Yes, and you will be glad you asked',
  'Patience. It is already on its way', 'The ink is warm on this one',
  'What you lost will be returned', 'Say yes and worry afterwards',
  'You have done the hard part already', 'Go gently. But go',
  'The ink shows an unexpected kindness', 'Ask again in a week and smile',
  'It will cost less than you fear', 'Two good things are coming at once',
  'Yes, though not in the order you expect', 'Someone remembers you fondly',
  'The ink says: you were right', 'Small beginnings. Large endings',
  'The answer is yes, and it is patient', 'You will finish it',
  'Rest first. Then everything', 'A stranger will be useful',
  'The ink sees your name on something', 'Yes, if you ask out loud',
  'Not yet, but soon', 'Turn the question over. The answer is underneath',
  'Ask the person you are avoiding', 'The ink refuses to settle. Try again',
  'Sleep on it. The ink has', 'Wait for the second post'
];

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var ans = document.getElementById('ans');
var parts = [], busy = false, t = 0, S = 300, visitor = null;

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  S = cv.clientWidth;
  cv.width = S * dpr; cv.height = S * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function spawn(n, burst){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = burst ? (0.5 + Math.random() * 2.1) : (0.05 + Math.random() * 0.25);
    parts.push({ x: S/2 + (Math.random()-0.5)*16, y: S/2 + (Math.random()-0.5)*16,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: 6 + Math.random()*18,
      life: 1, dec: 0.004 + Math.random()*0.008, seed: Math.random()*100 });
  }
}

function drawHand(k){
  ctx.beginPath();
  ctx.ellipse(0, 0, k * 0.26, k * 0.30, 0, 0, Math.PI * 2);
  ctx.fill();
  var fingers = [[-0.20, -0.34, 0.062, 0.19, -0.20],
                 [-0.07, -0.42, 0.066, 0.23, -0.07],
                 [ 0.07, -0.41, 0.065, 0.22,  0.09],
                 [ 0.20, -0.33, 0.058, 0.18,  0.26]];
  fingers.forEach(function(f){
    ctx.save();
    ctx.translate(k * f[0], k * f[1]);
    ctx.rotate(f[4] * 0.7);
    ctx.beginPath();
    ctx.ellipse(0, 0, k * f[2], k * f[3], 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  ctx.save();
  ctx.translate(-k * 0.30, k * 0.06);
  ctx.rotate(-0.9);
  ctx.beginPath();
  ctx.ellipse(0, 0, k * 0.062, k * 0.17, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFace(k){
  ctx.beginPath();
  ctx.moveTo(-k * 0.02, -k * 0.42);
  ctx.bezierCurveTo(-k * 0.30, -k * 0.40, -k * 0.36, -k * 0.14, -k * 0.31, -k * 0.02);
  ctx.bezierCurveTo(-k * 0.40, k * 0.02, -k * 0.33, k * 0.07, -k * 0.27, k * 0.08);
  ctx.bezierCurveTo(-k * 0.29, k * 0.19, -k * 0.22, k * 0.25, -k * 0.14, k * 0.30);
  ctx.bezierCurveTo(-k * 0.02, k * 0.40, k * 0.20, k * 0.36, k * 0.26, k * 0.16);
  ctx.bezierCurveTo(k * 0.34, -k * 0.10, k * 0.24, -k * 0.38, -k * 0.02, -k * 0.42);
  ctx.closePath();
  ctx.fill();
}

function summon(){ visitor = { kind: Math.random() < 0.5 ? 'hand' : 'face', age: 0 }; }

function drawVisitor(){
  if (!visitor) return;
  visitor.age += 1 / 60;
  var p = visitor.age / 2.6;
  if (p >= 1){ visitor = null; return; }
  var rise = 1 - Math.pow(1 - Math.min(p * 1.5, 1), 3);
  var fade = p < 0.45 ? (p / 0.45) : (1 - (p - 0.45) / 0.55);
  ctx.save();
  ctx.filter = 'blur(' + (S * 0.028) + 'px)';
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(150,166,208,' + (fade * 0.30).toFixed(3) + ')';
  ctx.translate(S / 2, S * (1.05 - rise * 0.58));
  if (visitor.kind === 'hand') drawHand(S * 0.62); else drawFace(S * 0.62);
  ctx.restore();
}

function frame(){
  t += 0.01;
  ctx.fillStyle = 'rgba(19,17,26,0.09)';
  ctx.fillRect(0, 0, S, S);
  ctx.globalCompositeOperation = 'lighter';
  for (var i = parts.length - 1; i >= 0; i--){
    var p = parts[i];
    p.vx += Math.sin(p.y * 0.02 + t + p.seed) * 0.035;
    p.vy += Math.cos(p.x * 0.02 + t + p.seed) * 0.035;
    p.vx *= 0.972; p.vy *= 0.972;
    p.x += p.vx; p.y += p.vy;
    p.r += 0.22 * (S / 300);
    p.life -= p.dec;
    var dx = p.x - S/2, dy = p.y - S/2;
    if (p.life <= 0 || Math.sqrt(dx*dx + dy*dy) > S/2){ parts.splice(i, 1); continue; }
    var al = p.life * 0.16;
    var rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    rg.addColorStop(0, 'rgba(126,138,176,' + al + ')');
    rg.addColorStop(0.5, 'rgba(72,80,116,' + (al * 0.5) + ')');
    rg.addColorStop(1, 'rgba(72,80,116,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  drawVisitor();
  if (parts.length < 26) spawn(1, false);
  requestAnimationFrame(frame);
}

function consult(){
  if (busy) return;
  busy = true;
  ans.style.opacity = '0';
  waterSwell();
  spawn(80, true);
  setTimeout(function(){ spawn(45, true); summon(); }, 300);
  setTimeout(function(){
    ans.textContent = answers[Math.floor(Math.random() * answers.length)];
    ans.style.opacity = '1';
    chime();
    busy = false;
  }, 2400);
}

cv.addEventListener('click', consult);
cv.addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); consult(); }
});
document.getElementById('go').addEventListener('click', consult);
document.getElementById('q').addEventListener('keydown', function(e){
  if (e.key === 'Enter') consult();
});
document.getElementById('mute').addEventListener('click', function(){
  muted = !muted;
  this.innerHTML = muted ? '&#9834;' : '&#9835;';
  this.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  this.style.opacity = muted ? '0.5' : '1';
});

spawn(20, false);
frame();

})();
</script>
</body>
</html>
